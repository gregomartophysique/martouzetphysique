<!DOCTYPE html>
<html>
<head>
    <title>Applications et codes</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script>
        window.onload = function () {
            var txt = document.getElementById("title_code");
            var p = getUrlParam("code_name");
            txt.innerHTML = p;
        }

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
    </script>
</head>
<body>
    <div class="wrapper">
        <!-- Menu -->
        #<MENU>#

    <!-- Page Content  -->
    <div id="content">
        <div id="header">
            <h1 id="title_code">Applications et codes</h1> 
        </div>
     </div>

</body>
</html>
