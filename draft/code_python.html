<!DOCTYPE html>
<html>
<head>
    <title>Applications et codes</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src="load_list.js"></script>
    <style>
        .element {
            display: flex;
            box-shadow: 0 0 0.5em gray;
            margin: 10px;
            height: 200px;
        }

            .element .right_side {
                margin: 10px;
                flex-basis: 45%;
                flex-grow: 1;
                flex-shrink: 0;
                display: block;
                unicode-bidi: isolate;
            }

            .element .title {
                margin-top: 0px;
                margin-bottom: 5px;
                font-family: Arial, sans-serif;
                font-size: 24px;
            }

            .element .thumbnail {
                text-align: center;
                margin: 10px;
                flex-basis: 30%;
                flex-grow: 0;
                flex-shrink: 0;
                display: inline-block;
                unicode-bidi: isolate;
                height: 180px;
                width: 100px;
            }

        .element .description {
            font-family: Arial, sans-serif;
        }

        .element .keywords {
            margin-bottom: 5px;
        }

        .element .keyword {
            display: inline-block;
            border-style: solid;
            border-width: 1px;
            margin: 1px;
            padding: 1px;
            color: gray;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        .thumbnail-image {
            height: 100%;
        }

        #code_type {

        }

        .code_type_class {
            border-style: solid;
            border-width: 1px;

        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Menu -->
        #<MENU>#

    <!-- Page Content  -->
             <div id="content">
                 <div id="header">

                     <h1>Applications et codes</h1>


                     <fieldset id="code_type">
                         <legend> Type d'application :</legend>

                         <ul class="listCheckbox" id="listLanguage">
                             <li><input type="checkbox" id="check_code_type_py" value="code_type_py" checked /><label for="check_code_type_py">Python</label></li>
                             <li><input type="checkbox" id="check_code_type_js" value="code_type_js" checked /><label for="check_code_type_js">JavaScript</label></li>

                         </ul>

                     </fieldset>


                     <fieldset>
                         <legend> Catégories :</legend>

                         <div class="container">
                             <ul class="listCheckbox" id="listCategorie">
                             </ul>

                         </div>
                     </fieldset>


                 </div>



                 <div id="liste">


                 </div>
             </div>
</body>
</html>
