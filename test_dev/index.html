<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lecture fichier texte</title>

    <!-- Coloration des codes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/arduino-light.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
    <style>
        code.hljs {
            display: inline;
            background: #f0f0f0;
            padding: 0.1em 0.2em;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <button id="load">Charger le fichier</button>

    <div id="output2" style="white-space: pre-wrap; margin-top: 20px;"></div>

    <div style="background: #f0f0f0; ">
        <pre id="output" class="python"><code>
    
</code></pre>

    <script>
        document.getElementById('load').addEventListener('click', () => {
            fetch('template_build.py')
                .then(response => response.text())
                .then(text => {
                    document.getElementById('output').textContent = text;
                    hljs.highlightElement(document.getElementById('output'));
                })
                .catch(error => {
                    document.getElementById('output').textContent = "Erreur : " + error;
                });
        });
    </script>

</body>
</html>
